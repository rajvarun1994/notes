<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Notes</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:#0f1115; color:#e7e9ee;
         font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #gate { min-height:100dvh; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:14px; padding:24px; }
  #gate .lbl { font-size:15px; color:#9aa1ad; }
  #gate input { font-size:17px; padding:12px 14px; width:min(360px,90vw); border-radius:10px;
                border:1px solid #2a2f3a; background:#171a21; color:#fff; }
  #gate button { font-size:16px; padding:12px 22px; border-radius:10px; border:0;
                 background:#3b82f6; color:#fff; }
  #err { color:#f87171; min-height:20px; font-size:14px; }
  #hint { color:#5f6773; font-size:12.5px; text-align:center; max-width:340px; }
  #view { display:none; max-width:820px; margin:0 auto; padding:56px 18px 90px; }
  #view h1 { font-size:22px; margin:26px 0 8px; }
  #view h2 { font-size:19px; margin:24px 0 6px; border-bottom:1px solid #232833; padding-bottom:5px; }
  #view h3 { font-size:16px; margin:18px 0 4px; color:#cdd3df; }
  #view p  { margin:8px 0; }
  #view ul,#view ol { padding-left:22px; margin:8px 0; }
  #view li { margin:4px 0; }
  #view hr { border:0; border-top:1px solid #232833; margin:24px 0; }
  #view code { background:#1b1f27; padding:1px 5px; border-radius:5px; font-size:14px; }
  #view blockquote { border-left:3px solid #3b82f6; margin:10px 0; padding:4px 12px;
                     color:#c7ccd6; background:#141821; border-radius:0 6px 6px 0; }
  #bar { position:fixed; top:0; left:0; right:0; display:none; justify-content:flex-end;
         gap:8px; align-items:center; padding:8px 14px; background:#0b0d11ee; backdrop-filter:blur(6px);
         border-bottom:1px solid #232833; }
  #bar button { background:#232833; color:#e7e9ee; border:0; border-radius:8px; padding:9px 14px; font-size:14px; }
  #bar button.pri { background:#3b82f6; color:#fff; }
  .muted { color:#5f6773; font-size:12.5px; }
  #toc { background:#141821; border:1px solid #232833; border-radius:12px; padding:12px 14px; margin:0 0 18px; }
  #toc b { font-size:12.5px; letter-spacing:.6px; color:#7d8593; text-transform:uppercase; }
  #toc a { display:block; padding:9px 2px; color:#9dc0ff; text-decoration:none;
           border-bottom:1px solid #1c212b; font-size:15px; }
  #toc a:last-child { border-bottom:0; }
  #view details { border:1px solid #232833; border-radius:12px; margin:10px 0; background:#12151c; }
  #view summary { cursor:pointer; padding:13px 14px; font-weight:600; font-size:15.5px; list-style:none; }
  #view summary::-webkit-details-marker { display:none; }
  #view summary::before { content:"▸ "; color:#6b7480; }
  #view details[open] summary::before { content:"▾ "; }
  #view details[open] summary { border-bottom:1px solid #232833; }
  #view details > *:not(summary) { padding-left:14px; padding-right:14px; }
  #view details > h2:first-of-type { margin-top:12px; }
</style>
</head>

</div>

let lockTimer = null;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.textContent = '';
  if(!pw){ return; }
  try{
    const salt=b64(DATA.salt), iv=b64(DATA.iv), ct=b64(DATA.ct);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt, iterations:DATA.iter, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
    render(new TextDecoder().decode(buf));
  }catch(e){
    err.textContent = 'Wrong passphrase.';
  }
}

let RAW = '';
function sections(md){
  return md.split(/\n(?=# )/).filter(s => s.trim()).map(s => {
    const m = s.match(/^# (.*)/);
    return { title: m ? m[1] : 'Notes', body: s.replace(/^# .*\n?/, '') };
  });
}
function openSec(i){
  const d = document.getElementById('s'+i);
  if(d){ d.open = true; d.scrollIntoView({behavior:'smooth', block:'start'}); }
}
function copyBrief(){
  const secs = sections(RAW);
  const b = secs.find(s => /BRIEF/i.test(s.title));
  const txt = b ? ('# ' + b.title + '\n' + b.body) : RAW;
  const btn = document.getElementById('cpy');
  navigator.clipboard.writeText(txt).then(
    () => { btn.textContent = 'Copied ✓'; setTimeout(() => btn.textContent = 'Copy brief', 1800); },
    () => { btn.textContent = 'Copy failed'; setTimeout(() => btn.textContent = 'Copy brief', 1800); }
  );
}
function render(md){
  RAW = md;
  const secs = sections(md);
  let toc = '<div id="toc"><b>Contents</b>';
  let body = '';
  secs.forEach((s, i) => {
    toc += '<a href="#" onclick="openSec(' + i + ');return false">' + esc(s.title) + '</a>';
    body += '<details id="s' + i + '"><summary>' + esc(s.title) + '</summary>'
          + mdToHtml(s.body) + '</details>';
  });
  toc += '</div>';
  document.getElementById('view').innerHTML = toc + body;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('view').style.display = 'block';
  document.getElementById('bar').style.display = 'flex';
  document.getElementById('pw').value = '';
  window.scrollTo(0,0);
  arm();
}
function lockNow(){
  const v = document.getElementById('view');
  v.innerHTML = ''; v.style.display = 'none';
  document.getElementById('bar').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  if(lockTimer) clearTimeout(lockTimer);
}
function arm(){ if(lockTimer) clearTimeout(lockTimer); lockTimer = setTimeout(lockNow, 180000); }
['click','keydown','touchstart','scroll'].forEach(ev =>
  document.addEventListener(ev, () => { if(document.getElementById('view').style.display==='block') arm(); }, {passive:true}));
document.addEventListener('visibilitychange', () => { if(document.hidden) lockNow(); });
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });

function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function inline(s){ return esc(s)
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  .replace(/\*(.+?)\*/g,'<i>$1</i>')
  .replace(/`(.+?)`/g,'<code>$1</code>'); }
function mdToHtml(md){
  const lines = md.split(/\r?\n/); let out = []; let list = null;
  const close = () => { if(list){ out.push(list==='ol'?'</ol>':'</ul>'); list=null; } };
  const ul = () => { if(list!=='ul'){ close(); out.push('<ul>'); list='ul'; } };
  const ol = () => { if(list!=='ol'){ close(); out.push('<ol>'); list='ol'; } };
  for(const ln of lines){
    if(/^### /.test(ln)){ close(); out.push('<h3>'+inline(ln.slice(4))+'</h3>'); }
    else if(/^## /.test(ln)){ close(); out.push('<h2>'+inline(ln.slice(3))+'</h2>'); }
    else if(/^# /.test(ln)){ close(); out.push('<h1>'+inline(ln.slice(2))+'</h1>'); }
    else if(/^>\s?/.test(ln)){ close(); out.push('<blockquote>'+inline(ln.replace(/^>\s?/,''))+'</blockquote>'); }
    else if(/^---+\s*$/.test(ln)){ close(); out.push('<hr>'); }
    else if(/^\s*[-*]\s+/.test(ln)){ ul(); out.push('<li>'+inline(ln.replace(/^\s*[-*]\s+/,''))+'</li>'); }
    else if(/^\s*\d+\.\s+/.test(ln)){ ol(); out.push('<li>'+inline(ln.replace(/^\s*\d+\.\s+/,''))+'</li>'); }
    else if(ln.trim()===''){ close(); }
    else { close(); out.push('<p>'+inline(ln)+'</p>'); }
  }
  close();
  return out.join('\n');
}
</script>
